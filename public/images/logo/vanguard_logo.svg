<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80">
  <defs>
    <linearGradient id="goldGleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4dc" />
      <stop offset="40%" stop-color="#dfba73" />
      <stop offset="85%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7633" />
    </linearGradient>
  </defs>

  <!-- Crest Emblem on Left -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="4" fill="#0f1218" stroke="url(#goldGleam)" stroke-width="1.5" />
    <!-- Scales inside seal -->
    <line x1="30" y1="14" x2="30" y2="46" stroke="url(#goldGleam)" stroke-width="2" />
    <line x1="16" y1="22" x2="44" y2="22" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="30" cy="14" r="2.5" fill="#fdf4dc" />
    <!-- Left Pan -->
    <path d="M 13 34 Q 18 39 23 34 Z" fill="url(#goldGleam)" />
    <line x1="18" y1="22" x2="14" y2="34" stroke="#dfba73" stroke-width="1" />
    <line x1="18" y1="22" x2="22" y2="34" stroke="#dfba73" stroke-width="1" />
    <!-- Right Pan -->
    <path d="M 37 34 Q 42 39 47 34 Z" fill="url(#goldGleam)" />
    <line x1="42" y1="22" x2="38" y2="34" stroke="#dfba73" stroke-width="1" />
    <line x1="42" y1="22" x2="46" y2="34" stroke="#dfba73" stroke-width="1" />
    <!-- Base -->
    <rect x="22" y="46" width="16" height="3" fill="url(#goldGleam)" />
  </g>

  <!-- Typography -->
  <text x="86" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">
    VANGUARD <tspan fill="url(#goldGleam)">&amp; JURIS</tspan>
  </text>
  <text x="88" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#a3aab8" letter-spacing="2.8">
    CHAMBERS OF SENIOR ADVOCATES &amp; COUNSEL
  </text>
</svg>
